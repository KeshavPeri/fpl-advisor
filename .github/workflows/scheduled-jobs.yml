name: Scheduled jobs

# Ticket #10 — the scaffold for the nightly write path. Today this runs only
# scripts/heartbeat.ts (no business logic yet, see the ticket); ingest jobs
# land on top of this same trigger in later tickets.

on:
  schedule:
    # 17:45 UTC daily. FPL-Core-Insights refreshes at 07:30 and 17:30 UTC, so
    # this is anchored shortly after the later of the two refreshes.
    # GitHub Actions cron is always UTC. Asia/Singapore is UTC+8 year-round
    # (no DST), so 17:45 UTC is 01:45 the FOLLOWING day in Singapore — this
    # schedule crosses the date line. Do not "fix" this cron to look like a
    # Singapore-evening time without re-deriving the UTC value; a Singapore
    # evening (e.g. 20:00 SGT) is 12:00 UTC the SAME day, a different line
    # entirely.
    - cron: '45 17 * * *'
  workflow_dispatch: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/heartbeat.ts

      - name: Run FPL-Core-Insights ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/ingest-core-insights.ts
      - name: Run FPL ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/ingest-fpl.ts

      - name: Project points
        # Ticket #33. Runs after the FPL ingest step above (needs fresh
        # players/teams/fixtures/gameweeks) and after the FPL-Core-Insights
        # ingest step above that (needs player_match_stats and teams.elo).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/project-points.ts

      - name: Sync squad from FPL
        # Ticket #14. Runs after the FPL ingest step above, which populates
        # the gameweeks and players tables this job reads from. FPL_ENTRY_ID
        # is optional at the secrets level: scripts/sync-squad.ts exits zero
        # with a named message and makes no request if it is unset, so this
        # step is safe to run before the entry id is known.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
        run: npx tsx scripts/sync-squad.ts

      - name: Emit projections CSV
        # Ticket #34 (product-brief.md §6c — "the seam"). Runs after the
        # "Project points" step above, which populates player_projections
        # this job reads from. Writes ./out/projections.csv (the
        # PROJECTIONS_CSV_PATH default) — a plain file on the runner. This
        # job does not check out, install or invoke the solver; item 12 is
        # what actually feeds this file to it.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/emit-projections-csv.ts

      - name: Upload projections CSV artifact
        # Runs even if the step above failed (if: always()), so a partial or
        # missing file can still be inspected/reported on — but
        # if-no-files-found: warn means a missing file only warns, never
        # fails this step and never fabricates an empty artifact. The
        # workflow's overall failure (if "Emit projections CSV" failed) is
        # never masked by this step: a red job here means that earlier step
        # failed, not that the upload itself did.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projections-csv
          path: out/projections.csv
          if-no-files-found: warn
          retention-days: 14
