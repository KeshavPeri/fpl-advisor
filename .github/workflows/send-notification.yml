name: Send notification

# Ticket #55 (feature-list item 14, product-brief.md §2: "so that
# acknowledging the notification and deciding are the same act"). Builds and
# sends the Telegram message for the current gameweek's recommendation.
#
# workflow_dispatch ONLY, deliberately — this ticket's own Scope OUT: "No
# scheduling logic, no 24h/10h trigger, no deadline arithmetic." Item 15 (a
# separate, later ticket) adds the scheduled 24h/10h trigger. Until then,
# this file exists so a send can be triggered on demand — by Keshav, or by
# a human reviewing from the phone.
#
# scripts/send-telegram.ts also runs as a step appended to
# .github/workflows/solver-run.yml, right after "Generate recommendations,"
# so a normal nightly solve already produces a notification without waiting
# for item 15. This file is the standalone, on-demand path — independent of
# that workflow ever having run.
#
# TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID do not exist as repository secrets yet
# (Tier 1, owner-only — creating the bot and chat is an owner action).
# scripts/send-telegram.ts handles that gracefully: it logs which variable
# is missing, makes no network request of any kind — including to Supabase
# — and exits zero. This workflow is safe to run (or leave sitting unused)
# before the bot exists.

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Telegram notification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/send-telegram.ts
